name: a11how
description: "Localization management for .arb based projects."
version: 1.0.1
publish_to: 'none'
repository: https://github.com/YWT-LLC/a11how

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Flutter (Google)
  go_router: ^18.0.1
  http: ^1.6.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  # Community
  archive: ^4.3.0
  file_picker: ^13.1.0
  file_saver: ^0.5.0
  provider: ^6.1.5+1
  url_launcher: ^6.3.2

  # YWT
  open_ui:
    path: ../open_ui

dev_dependencies:
  dependency_validator: ^5.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/icon.png

flutter_launcher_icons:
  image_path: assets/icon.png
  adaptive_icon_foreground: assets/icon.png
  adaptive_icon_background: "#000000"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true

flutter_native_splash:
  image: assets/icon.png
  image_dark: assets/icon.png
  color: "#DAA520"
  color_dark: "#DAA520"
  android: true
  ios: true
  web: true